name: Android validation

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare temporary debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compile and test
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: seoga-debug-test-only
          path: app/build/outputs/apk/debug/*.apk
