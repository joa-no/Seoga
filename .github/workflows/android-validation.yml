name: Android validation

on:
  workflow_dispatch:
    inputs:
      signed_release:
        description: Build with original release key
        type: boolean
        default: false
  push:
    paths:
      - '.github/workflows/android-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate Android SDK and install required packages
        shell: bash
        run: |
          set -eu
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -path '*/bin/sdkmanager' | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          "$SDKMANAGER" --sdk_root="$SDK_ROOT" "platforms;android-36.1" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Prepare temporary debug signing key
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -keystore debug.keystore -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
      - name: Compile and test
        run: bash gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/tests/
            app/schemas/
      - uses: actions/upload-artifact@v4
        with:
          name: seoga-debug-test-only
          path: app/build/outputs/apk/debug/*.apk

      - name: Build signed update
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.signed_release)
        env:
          KEYSTORE_BASE64: ${{ secrets.SEOGA_KEYSTORE_BASE64 }}
          KEYSTORE_PATH: ${{ runner.temp }}/seoga-release.jks
          STORE_PASSWORD: ${{ secrets.SEOGA_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.SEOGA_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.SEOGA_KEY_ALIAS }}
        run: |
          set -eu
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
          umask 077
          trap 'rm -f "$KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          bash gradlew --no-daemon :app:assembleRelease
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs app/build/outputs/apk/release/*.apk | tee "$RUNNER_TEMP/seoga-cert.txt"
          grep -qi 'c4e2b520c8e8187497931b38607a1819c5aa2e63fe84e58ac965436411dad52c' "$RUNNER_TEMP/seoga-cert.txt"
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.signed_release)
        with:
          name: seoga-signed-update
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
